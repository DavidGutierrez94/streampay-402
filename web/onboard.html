<style>
.shell{max-width:560px;margin:0 auto;padding:24px 0 48px}
h1{font-size:clamp(28px,6vw,36px);letter-spacing:-.03em;line-height:1.1;font-weight:600;margin:14px 0 8px}
.sub{color:var(--muted);margin:0 0 24px}
#root{display:flex;flex-direction:column;gap:12px}
#root>p{margin:0}
.muted{color:var(--muted);font-size:13px;word-break:break-all}
#root>p.muted{padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px var(--line)}
#root>button,.card button,.keys button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--text);color:#09090b;font:500 14px var(--sans);cursor:pointer;transition:transform .15s,background .15s,opacity .15s}
#root>button{width:100%;min-height:48px;font-size:15px}
button:hover{background:#fff}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:progress}
button.link{min-height:0!important;padding:0!important;background:none!important;color:var(--accent-text)!important;font-size:13px!important;margin-left:6px}
.card{padding:20px}
label{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:14px}
input{display:block;width:100%;margin-top:6px;min-height:44px;padding:0 14px;background:var(--panel-2);color:var(--text);border:1px solid var(--line-2);border-radius:10px;font:15px var(--sans);transition:border-color .15s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .row{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.card .row button{width:100%;justify-content:flex-start;background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:10px}
.card .row button:hover{box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel-2)}
.card .row button:nth-child(2){background:var(--accent);box-shadow:none;color:#fff}
.keys{margin-top:18px;padding:16px;border-radius:12px;background:var(--green-soft);box-shadow:inset 0 0 0 1px rgba(61,214,140,.25);font-size:13px;color:var(--muted)}
.keys b{color:var(--green);display:block;font-size:14px;margin-bottom:4px}
.key{display:flex;gap:8px;align-items:center;margin:10px 0}
.key code{flex:1;min-width:0;word-break:break-all;font:12.5px var(--mono);color:var(--text);background:#000;padding:10px 12px;border-radius:8px}
.keys button{min-height:36px;padding:0 14px;font-size:13px}
pre{white-space:pre-wrap;word-break:break-all;font:12px/1.6 var(--mono);color:var(--muted);background:#000;padding:12px;border-radius:8px;margin:10px 0 0}
.card ul{list-style:none;margin:16px 0 0;padding:0;font-size:13px;color:var(--muted)}
.card ul li{padding:8px 0;border-top:1px solid var(--line)}
.card ul li::before{content:"✓ ";color:var(--green)}
.trust{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:20px;color:var(--faint);font-size:12.5px}
</style></head><body><div class="wrap">

<p class="sub">Sign up or log in with email, register your service onchain, and get Stripe-style <span class="mono">pk_</span>/<span class="mono">sk_</span> keys.</p>
